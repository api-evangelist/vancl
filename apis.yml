aid: vancl
name: VANCL
description: >-
  VANCL (凡客诚品) is a Chinese direct-to-consumer online apparel brand founded in
  October 2007 that sells its own-brand men's wear, women's wear, shoes,
  children's clothing, and home goods through vancl.com and official storefronts
  on Tmall, JD.com, Douyin, and Youzan. Once China's leading independent B2C
  fashion retailer, VANCL publishes no public API or developer platform today —
  its legacy open-platform hosts (open.vancl.com, api.vancl.com) no longer
  respond. Surfaced as a Qiming Venture Partners portfolio company in the API
  Evangelist network.
